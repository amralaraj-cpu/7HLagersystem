services:
  # PostgreSQL Database
  - type: pserv
    name: 7hlager-db
    env: docker
    plan: free
    region: frankfurt
    databaseName: hlager
    databaseUser: hlager_user
    ipAllowList: []

  # Backend API
  - type: web
    name: 7hlager-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: cd backend && npm install && node database/migrate.js && node database/seed.js
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: 7hlager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        value: noreply@sjuharads.se
      - key: EMAIL_PASS
        value: change-this-in-dashboard
      - key: EMAIL_FROM
        value: noreply@sjuharads.se
      - key: COMPANY_NAME
        value: Sjuhärads Biluthyrning & Transport AB
      - key: COMPANY_ORG_NUMBER
        value: 556789-1234
      - key: COMPANY_ADDRESS
        value: Borås, Sweden
      - key: COMPANY_PHONE
        value: 070-123 45 67
      - key: COMPANY_EMAIL
        value: info@sjuharads.se
      - key: COMPANY_WEBSITE
        value: www.sjuharads.se
      - key: FRONTEND_URL
        fromService:
          type: web
          name: 7hlager-frontend
          property: host

  # Frontend React App
  - type: web
    name: 7hlager-frontend
    env: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: 7hlager-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_NAME
        value: 7HLager
      - key: VITE_COMPANY_NAME
        value: Sjuhärads Biluthyrning & Transport AB
